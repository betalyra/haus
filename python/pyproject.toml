[project]
name = "haus-fmt"
version = "0.0.1"
description = "The haus data format for Python: a spec-compliant parser with no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["haus", "data format", "parser", "serialization", "schema"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/betalyra/haus-fmt"
Repository = "https://github.com/betalyra/haus-fmt"
Specification = "https://github.com/betalyra/haus-fmt/tree/main/spec"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

# Installed as `haus-fmt`, imported as `haus`.
[tool.uv.build-backend]
module-name = "haus"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1.400", "mypy>=1.18"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "fuzz"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
