[package]
# Published as haus-fmt (the name haus is taken on crates.io), imported as haus.
name = "haus-fmt"
version = "0.1.0"
description = "The haus data format: parser and data model"
readme = "../README.md"
keywords = ["haus", "data-format", "parser", "serialization", "schema"]
categories = ["parser-implementations", "encoding"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "haus"

[features]
# `haus::hash`, `haus::hash_all` and `haus::Hasher` (spec §12): SHA-256 of canonical forms.
hash = ["dep:sha2"]
# Conversions between `haus::Int` and `num_bigint::BigInt`.
bigint = ["dep:num-bigint"]

[dependencies]
num-bigint = { version = "0.4.6", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
