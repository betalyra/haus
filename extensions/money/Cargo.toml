[package]
name = "haus-money"
version = "1.0.0"
description = "@haus/money: Exact amounts with a currency (a haus schema package)"
edition = "2024"
license = "MIT"
# Tells crates that depend on this one where its schema is (haus_build::package).
links = "haus-money"
include = ["Cargo.toml", "build.rs", "src", "haus.package.haus", "*.schema.haus", "profiles"]

[dependencies]
haus = { package = "haus-fmt", path = "../../rust/haus", version = "0.1.0" }

[build-dependencies]
haus-build = { path = "../../rust/haus-build", version = "0.1.0" }
